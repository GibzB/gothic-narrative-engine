<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Haunted Manor - Gothic Narrative Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --gothic-black: #0a0a0a;
      --gothic-charcoal: #1a1a1a;
      --gothic-gray: #3a3a3a;
      --gothic-silver: #8a8a8a;
      --gothic-pale: #c0c0c0;
      --gothic-gold: #d4af37;
      --gothic-blood: #8b0000;
      --gothic-crimson: #dc143c;
      --gothic-purple: #4a0e4e;
      --gothic-mist: #778899;
      --font-display: 'Cinzel', serif;
      --font-body: 'Crimson Text', serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: var(--gothic-pale);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .stars {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 0;
    }
    .stars::before, .stars::after {
      content: '';
      position: absolute;
      width: 2px; height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 100px 200px white, 300px 150px white, 500px 400px white, 200px 600px white, 600px 100px white, 150px 500px white, 400px 300px white, 700px 250px white, 250px 350px white, 550px 550px white, 350px 100px white, 650px 450px white, 50px 300px white, 450px 200px white, 750px 350px white, 100px 450px white, 300px 50px white, 500px 650px white, 600px 500px white, 200px 100px white;
      animation: twinkle 4s ease-in-out infinite;
    }
    .stars::after { top: 50%; animation-delay: 2s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .loader-container { text-align: center; }
    .book {
      width: 120px;
      height: 90px;
      background: linear-gradient(135deg, #6b21a8, #9333ea);
      border-radius: 4px;
      margin: 0 auto 30px;
      position: relative;
      transform-style: preserve-3d;
      animation: bookPulse 3s ease-in-out infinite;
      box-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
    }
    .book::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 10px;
      width: 45%;
      height: 70px;
      background: #f5f5f5;
      transform-origin: left;
      animation: pageFlip 3s ease-in-out infinite;
    }
    @keyframes bookPulse { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(-30deg); } }
    @keyframes pageFlip { 0%, 100% { transform: rotateY(0deg); } 50% { transform: rotateY(-160deg); } }
    .loader-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: var(--gothic-gold);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 20px;
      text-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
    }
    .text-loader { width: 100px; height: 30px; margin: 0 auto; position: relative; }
    .loader-text { position: absolute; top: 0; color: #C8B6FF; font-size: 0.8rem; letter-spacing: 1px; animation: textAnim 3s ease infinite; }
    .load-bar { position: absolute; bottom: 0; width: 16px; height: 16px; background: #9A79FF; border-radius: 50px; animation: loadAnim 3s ease infinite; }
    @keyframes textAnim { 0% { letter-spacing: 1px; } 40% { letter-spacing: 3px; } 100% { letter-spacing: 1px; } }
    @keyframes loadAnim { 0% { width: 16px; } 40% { width: 80px; } 100% { width: 16px; } }
    .gothic-container { max-width: 900px; width: 100%; }
    .story-panel {
      background: linear-gradient(180deg, rgba(26, 26, 26, 0.95) 0%, rgba(10, 10, 10, 0.98) 100%);
      border: 1px solid var(--gothic-gray);
      border-radius: 12px;
      padding: 3rem;
      position: relative;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 80px rgba(139, 0, 0, 0.2);
    }
    .story-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gothic-blood), var(--gothic-crimson), var(--gothic-blood), transparent);
    }
    .scene-title {
      font-family: var(--font-display);
      font-size: 2.5rem;
      color: var(--gothic-gold);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--gothic-gray);
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
    }
    .scene-description {
      font-family: var(--font-body);
      font-size: 1.25rem;
      line-height: 2;
      color: var(--gothic-pale);
      white-space: pre-wrap;
      margin-bottom: 2rem;
    }
    .choices-container { display: flex; flex-direction: column; gap: 1rem; margin-top: 2rem; }
    .choice-button {
      position: relative;
      cursor: pointer;
      padding: 2px;
      background: linear-gradient(to top, #8b0000, #dc143c);
      border-radius: 12px;
      border: none;
      width: 100%;
      text-align: left;
      transition: all 0.3s ease;
    }
    .choice-button:hover { transform: translateX(10px); box-shadow: 0 0 30px rgba(139, 0, 0, 0.5); }
    .choice-button:active { transform: scale(0.98) translateX(10px); }
    .choice-button-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      background: linear-gradient(to top, #5c0000, #8b0000);
      color: white;
      border-radius: 10px;
      font-family: var(--font-display);
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .choice-button-icon { width: 20px; height: 20px; flex-shrink: 0; }
    .stats-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(26, 26, 26, 0.9);
      border: 1px solid var(--gothic-gray);
      border-radius: 8px;
      padding: 1rem;
      min-width: 200px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .stat-item { padding: 0.5rem 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .stat-item:last-child { border-bottom: none; }
    .stat-label { font-family: var(--font-display); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gothic-silver); }
    .stat-bar { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .stat-bar-fill { height: 100%; background: linear-gradient(90deg, var(--gothic-blood), var(--gothic-crimson)); transition: width 0.4s ease; }
    .stat-value { font-family: monospace; font-size: 0.875rem; color: var(--gothic-gold); float: right; }
    .inventory-panel {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: rgba(26, 26, 26, 0.9);
      border: 1px solid var(--gothic-gray);
      border-radius: 8px;
      padding: 1rem;
      min-width: 150px;
      backdrop-filter: blur(10px);
      z-index: 100;
    }
    .inventory-title { font-family: var(--font-display); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gothic-silver); margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .inventory-item { font-family: var(--font-body); font-size: 0.875rem; color: var(--gothic-gold); padding: 0.25rem 0; text-transform: capitalize; }
    .ending-panel { text-align: center; padding: 2rem; }
    .ending-type { font-family: var(--font-display); font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.2em; padding: 0.5rem 1.5rem; border-radius: 4px; display: inline-block; margin-bottom: 1.5rem; }
    .ending-type.good { background: rgba(212, 175, 55, 0.2); color: var(--gothic-gold); border: 2px solid var(--gothic-gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); }
    .ending-type.secret { background: rgba(147, 51, 234, 0.2); color: #c084fc; border: 2px solid #9333ea; box-shadow: 0 0 30px rgba(147, 51, 234, 0.3); }
    .ending-type.neutral { background: rgba(119, 136, 153, 0.2); color: var(--gothic-mist); border: 2px solid var(--gothic-mist); }
    .lightning-flash { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.1); pointer-events: none; opacity: 0; z-index: 1000; }
    .lightning-flash.active { animation: lightning 0.2s ease-out; }
    @keyframes lightning { 0% { opacity: 0; } 10% { opacity: 0.8; } 20% { opacity: 0; } 30% { opacity: 0.6; } 100% { opacity: 0; } }
    .fade-in { animation: fadeIn 0.8s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 768px) {
      .story-panel { padding: 1.5rem; }
      .scene-title { font-size: 1.75rem; }
      .stats-panel, .inventory-panel { position: relative; top: auto; right: auto; bottom: auto; left: auto; margin: 1rem 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div id="lightning-flash" class="lightning-flash"></div>
  <div id="app">
    <div class="loader-container">
      <h1 class="loader-title">The Haunted Manor</h1>
      <div class="book"></div>
      <div class="text-loader">
        <span class="loader-text">loading</span>
        <div class="load-bar"></div>
      </div>
    </div>
  </div>
  <script>
    // Configure API URL - UPDATE THIS with your Render URL after deployment
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? window.location.origin
      : 'https://gothic-narrative-engine.onrender.com'\; // Replace with your Render URL
    
    let currentScene = null;
    let playerState = {
      currentScene: 'start',
      inventory: [],
      stats: { sanity: 100, courage: 50, knowledge: 0, suspicion: 0 },
      flags: {},
      choicesMade: []
    };
    
    const appEl = document.getElementById('app');
    const lightningFlash = document.getElementById('lightning-flash');
    
    function triggerLightning() {
      lightningFlash.classList.add('active');
      setTimeout(() => lightningFlash.classList.remove('active'), 200);
      setTimeout(() => { lightningFlash.classList.add('active'); setTimeout(() => lightningFlash.classList.remove('active'), 100); }, 200);
    }
    
    function typewriter(element, text, speed = 15) {
      return new Promise(resolve => {
        let index = 0;
        element.textContent = '';
        const interval = setInterval(() => {
          if (index < text.length) { element.textContent += text[index]; index++; }
          else { clearInterval(interval); resolve(); }
        }, speed);
      });
    }
    
    async function makeChoice(choiceId) {
      if (!currentScene) return;
      try {
        const response = await fetch(`${API_BASE}/story/choose?choice_id=${choiceId}&current_scene=${currentScene.id}`, { method: 'POST' });
        if (!response.ok) throw new Error('Failed');
        const data = await response.json();
        currentScene = data;
        if (data.player_state) playerState = data.player_state;
        renderScene();
      } catch (error) { console.error('Error:', error); }
    }
    
    async function restartStory() {
      try {
        const response = await fetch(`${API_BASE}/story/restart`, { method: 'POST' });
        const data = await response.json();
        currentScene = data;
        playerState = { currentScene: 'start', inventory: [], stats: { sanity: 100, courage: 50, knowledge: 0, suspicion: 0 }, flags: {}, choicesMade: [] };
        renderScene();
      } catch (error) { console.error('Error:', error); }
    }
    
    async function renderScene() {
      if (!currentScene) return;
      if (currentScene.atmosphere?.lightning) setTimeout(triggerLightning, 500);
      
      appEl.innerHTML = `
        <div class="gothic-container">
          <div class="stats-panel">
            <div class="stat-item"><span class="stat-label">Sanity <span class="stat-value">${playerState.stats.sanity}</span></span><div class="stat-bar"><div class="stat-bar-fill" style="width: ${playerState.stats.sanity}%"></div></div></div>
            <div class="stat-item"><span class="stat-label">Courage <span class="stat-value">${playerState.stats.courage}</span></span><div class="stat-bar"><div class="stat-bar-fill" style="width: ${playerState.stats.courage}%"></div></div></div>
            <div class="stat-item"><span class="stat-label">Knowledge <span class="stat-value">${playerState.stats.knowledge}</span></span><div class="stat-bar"><div class="stat-bar-fill" style="width: ${playerState.stats.knowledge}%"></div></div></div>
            <div class="stat-item"><span class="stat-label">Suspicion <span class="stat-value">${playerState.stats.suspicion}</span></span><div class="stat-bar"><div class="stat-bar-fill" style="width: ${playerState.stats.suspicion}%"></div></div></div>
          </div>
          <div class="story-panel fade-in">
            <h2 class="scene-title">${currentScene.title}</h2>
            <div class="scene-description" id="scene-text"></div>
            <div class="choices-container" id="choices-container" style="display: none;"></div>
            ${currentScene.is_ending ? `<div class="ending-panel"><div class="ending-type ${currentScene.ending_type}">${currentScene.ending_type?.toUpperCase()} ENDING</div><div style="margin-top: 20px;"><button class="choice-button" onclick="restartStory()"><span class="choice-button-inner"><svg class="choice-button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>Begin Again</span></button></div></div>` : ''}
          </div>
          <div class="inventory-panel">
            <div class="inventory-title">Inventory</div>
            ${playerState.inventory.length === 0 ? '<div class="inventory-item" style="opacity: 0.5;">Empty</div>' : playerState.inventory.map(item => `<div class="inventory-item">${item.replace(/_/g, ' ')}</div>`).join('')}
          </div>
        </div>
      `;
      
      const textEl = document.getElementById('scene-text');
      if (textEl) await typewriter(textEl, currentScene.description);
      
      const choicesContainer = document.getElementById('choices-container');
      if (choicesContainer && !currentScene.is_ending) {
        choicesContainer.style.display = 'flex';
        choicesContainer.innerHTML = currentScene.choices.filter(c => c.is_available).map(choice => `
          <button class="choice-button" onclick="makeChoice('${choice.id}')">
            <span class="choice-button-inner">
              <svg class="choice-button-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              ${choice.text}
            </span>
          </button>
        `).join('');
      }
    }
    
    window.makeChoice = makeChoice;
    window.restartStory = restartStory;
    
    async function init() {
      try {
        const response = await fetch(`${API_BASE}/story/start`);
        currentScene = await response.json();
        renderScene();
      } catch (error) {
        console.error('Failed:', error);
        appEl.innerHTML = `<div class="gothic-container" style="text-align: center;"><h1 class="loader-title">Connection Error</h1><p style="color: var(--gothic-silver); margin: 20px 0;">Unable to connect to the narrative engine.</p><button class="choice-button" onclick="location.reload()"><span class="choice-button-inner">Retry</span></button></div>`;
      }
    }
    
    init();
  </script>
</body>
</html>
